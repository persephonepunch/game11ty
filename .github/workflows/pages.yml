name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    # Release gate: every asset is scanned in a throwaway container with no
    # network and no secrets, so a hostile file has nothing to reach.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan assets, then prove the scan rules with tests (isolated, no network)
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD/src:/scan/src:ro" -v "$PWD/scripts:/scan/scripts:ro" -v "$PWD/tests:/scan/tests:ro" \
            -v "$PWD/report:/scan/report" -w /scan/report python:3.12-slim sh -c '
              python /scan/scripts/asset_scan.py /scan/src &&
              python -m unittest discover -s /scan/tests -v &&
              python /scan/tests/mutate.py'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-report
          path: report/scan-report.json

  worker-tests:
    # SB-15: the head function, tested in Cloudflare's runtime (workerd via
    # Miniflare), plus a mutation check that every rule has a failing test.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node --test
      - run: node mutate.mjs

  firmware-tests:
    # SB-19: the no_std parser (no OS, no heap), tested on the host with a
    # mutation check, then built for a Cortex-M chip and for WebAssembly.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/glb-parse
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add thumbv7em-none-eabihf wasm32-unknown-unknown
      - run: cargo test
      - run: python3 mutate.py
      - run: cargo build --release --target thumbv7em-none-eabihf
      - run: cargo build --release --target wasm32-unknown-unknown

  build:
    needs: [scan, worker-tests, firmware-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
        env:
          PATH_PREFIX: /game11ty/
      - name: Hash manifest of the release
        run: python3 scripts/asset_scan.py --manifest _site
      - name: Diff against the live release (SB-24, diagnosis and record only)
        # Never blocks: it reports which files' bytes changed and keeps the record.
        continue-on-error: true
        run: |
          curl -fsS https://persephonepunch.github.io/game11ty/asset-manifest.json -o previous-manifest.json \
            || echo "no previous manifest reachable; this release is the baseline"
          python3 scripts/manifest_diff.py previous-manifest.json _site/asset-manifest.json \
            --out _site/manifest-diff.json --summary "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manifest-diff
          path: _site/manifest-diff.json
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
